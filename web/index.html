<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7f8"><title>用户中心</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="/" aria-label="用户中心首页"><span class="brand-mark">U</span><span>用户中心</span></a><span class="top-note">安全账户管理</span></header>
<section class="layout"><aside class="intro"><div class="eyebrow"><span class="live-dot"></span>账户与身份</div><h1>从邮箱开始，<br>管理你的账户。</h1><p>注册前验证邮箱，帮助保护你的账户安全。</p><div class="security-note"><span class="shield" aria-hidden="true">✓</span><span>验证码仅用于本次注册<br><small>10 分钟内有效</small></span></div></aside>
<section class="panel" aria-labelledby="form-title"><div id="account-view" class="account-view" hidden><span class="account-icon" aria-hidden="true">✓</span><p class="eyebrow">已登录</p><h2>欢迎回来</h2><p id="account-email" class="account-email"></p><button id="logout-button" class="button button-secondary" type="button">退出登录</button></div>
<div id="auth-view"><div class="panel-head"><div><p class="eyebrow">ACCOUNT</p><h2 id="form-title">创建账户</h2></div><span class="step-indicator"><i></i><i></i><i></i></span></div>
<div class="tabs" role="tablist" aria-label="账户操作"><button id="register-tab" class="tab active" type="button" role="tab" aria-selected="true">注册</button><button id="login-tab" class="tab" type="button" role="tab" aria-selected="false">登录</button></div>
<form id="register-form" novalidate><label for="register-email">邮箱地址</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254" required><label for="verification-code">邮箱验证码</label><div class="code-row"><input id="verification-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" maxlength="6" pattern="[0-9]{6}" required><button id="send-code" class="button button-code" type="button">发送验证码</button></div><label for="register-password">设置密码</label><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="至少 10 位" minlength="10" maxlength="128" required><p class="field-hint">密码长度为 10 至 128 位</p><p class="message" id="register-message" role="status" aria-live="polite"></p><button class="button button-primary" type="submit">创建账户 <span aria-hidden="true">→</span></button></form>
<form id="login-form" novalidate hidden><label for="login-email">邮箱地址</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254" required><label for="login-password">密码</label><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="输入账户密码" required><p class="message" id="login-message" role="status" aria-live="polite"></p><button class="button button-primary" type="submit">登录 <span aria-hidden="true">→</span></button></form><p class="privacy-note">继续即表示你同意以邮箱验证账户身份。</p></div></section></section>
<footer><span>用户管理系统</span><span>安全 · 简洁 · 可靠</span></footer></main><script src="/app.js" defer></script></body></html>
